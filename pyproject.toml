[project]
name = "rag-eval-whatsapp-bot"
version = "0.1.0"
description = "A RAG pipeline with measured evals, served as a WhatsApp Cloud API webhook."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "fastapi",
    "httpx",
    "markdown-it-py",
    "python-dotenv",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["modamayor", "wabot"]
